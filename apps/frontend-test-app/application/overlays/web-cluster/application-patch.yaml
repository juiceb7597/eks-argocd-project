apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-test-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/write-back-method: git:repocreds #git:secret:argocd/gitea-creds
    argocd-image-updater.argoproj.io/image-list: frontend-test-app=ACCOUNT_NUMBER.dkr.ecr.ap-northeast-1.amazonaws.com/test-app/frontend-test-app
    argocd-image-updater.argoproj.io/frontend-test-app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend-test-app.allow-tags: regexp:^frontend-test-app-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
spec:
  source:
    repoURL: 'https://example.com/test-repo/test.git'
    targetRevision: master
    path: apps/frontend-test-app/resources/overlays/web-cluster
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: front-end
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jqPathExpressions:
        - '.spec.replicas'
        - '.status'