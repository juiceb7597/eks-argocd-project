apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps-web
  namespace: argocd
spec:
  project: app
  sources: 
    - repoURL: 'https://example.com/test-repo/test.git'
      path: apps/frontend-test-app/application/overlays/web-cluster
      targetRevision: master
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true