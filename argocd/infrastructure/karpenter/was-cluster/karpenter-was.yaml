apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-app-was
spec:
  project: infrastructure
  sources: 
    - repoURL: 'https://example.com/test-repo/test.git'
      path: infrastructure/karpenter/helm/overlays/was-cluster
      targetRevision: master
    - repoURL: 'https://example.com/test-repo/test.git'
      path: infrastructure/karpenter/application/overlays/was-cluster
      targetRevision: master
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
