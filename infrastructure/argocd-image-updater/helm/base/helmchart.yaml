apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: infrastructure
  source:
    chart: argocd-image-updater
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: changeme
    helm:
      valuesObject:
        extraEnv:
          - name: AWS_REGION
            value: changeme
          # https://argocd-image-updater.readthedocs.io/en/stable/install/installation/#configure-api-access-token-secret
          - name: ARGOCD_TOKEN
            valueFrom:
              secretKeyRef:
                name: changeme
                key: changeme
        extraArgs:
          - changeme
          - changeme
        config:
          logLevel: changeme
          argocd:
            grpcWeb: changeme
            serverAddress: changeme
            insecure: false
          registries:
            - name: ECR
              api_url: changeme
              prefix: changeme
              ping: changeme
              credentials: changeme
              credsexpire: changeme
        authScripts:
          enabled: true
          scripts:
            ecr-login.sh: |
              #!/bin/sh
              echo "AWS:$(aws ecr get-login-password --region $AWS_REGION)"
        serviceAccount:
          create: true
          name: argocd-image-updater
        rbac:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd