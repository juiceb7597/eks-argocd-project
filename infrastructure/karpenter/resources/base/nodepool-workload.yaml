apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workload
spec:
  template:
    metadata:
      labels:
        node-type: workload
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: workload
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # - key: karpenter.k8s.aws/instance-size
        #   operator: In
        #   values: ["xlarge"]
        # - key: karpenter.k8s.aws/instance-family
        #   operator: In
        #   values: ["m7i"]
      # taints:
      #   - key: node-type
      #     value: workload
      #     effect: NoSchedule
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 3m