apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: application-patch.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: opentelemetry-custom
      namespace: argocd
    patch: |-
      - op: replace
        path: /metadata/name
        value: opentelemetry-custom-web