apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secret
  namespace: argocd
spec:
  project: infrastructure
  source:
    chart: sealed-secrets
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    targetRevision: 2.17.7
    helm:
      valuesObject:
        fullnameOverride: changeme
        keyRenewPeriod: changeme
  destination:
    server: changeme
    namespace: changeme